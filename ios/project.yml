# XcodeGen 설정: ios/setup.sh 가 이 파일로 KittyCal.xcodeproj 를 만든다.
name: KittyCal
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  KittyCal:
    type: application
    platform: iOS
    sources:
      - path: KittyCal
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).kittycal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: KittyCal/KittyCal.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: KittyCal/Info.plist
      properties:
        CFBundleDisplayName: 함께 캘린더
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppURL: $(APP_URL)
        AppGroupID: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLName: kittycal
            CFBundleURLSchemes:
              - kittycal
    dependencies:
      - target: KittyCalWidget
  KittyCalWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KittyCalWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).kittycal.widget
    entitlements:
      path: KittyCalWidget/KittyCalWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: KittyCalWidget/Info.plist
      properties:
        CFBundleDisplayName: 함께 캘린더
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  KittyCal:
    build:
      targets:
        KittyCal: all
        KittyCalWidget: all
    run:
      config: Debug
    archive:
      config: Release
