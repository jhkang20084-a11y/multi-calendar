<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="개인·연인·가족·친구·모임을 위한 실시간 공유 캘린더" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="함께 캘린더" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>함께 캘린더</title>
    <script>
      // Google 로그인이 미리 허용된 주소(*.firebaseapp.com)에서 앱을 쓰도록 *.web.app 으로 들어오면 옮긴다.
      // (앱 주소 = 로그인 처리 주소가 되어 iPhone Safari·홈 화면 앱에서도 로그인이 막히지 않는다)
      if (/\.web\.app$/.test(location.hostname)) {
        location.replace('https://' + location.hostname.replace(/\.web\.app$/, '.firebaseapp.com')
          + location.pathname + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
